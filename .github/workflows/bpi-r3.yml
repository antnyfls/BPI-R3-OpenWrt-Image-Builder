name: Build Banana BPI R3 Firmware
on:
  workflow_dispatch:
jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
             - name: Checkout
               uses: actions/checkout@main
             - name: Build Firmware
               run: |
                wget https://downloads.openwrt.org/snapshots/targets/mediatek/filogic/openwrt-imagebuilder-mediatek-filogic.Linux-x86_64.tar.zst
                tar -xf openwrt-imagebuilder-mediatek-filogic.Linux-x86_64.tar.zst
                mkdir -p openwrt-imagebuilder-mediatek-filogic.Linux-x86_64/files/etc/config
                cp .github/workflows/dockerd openwrt-imagebuilder-mediatek-filogic.Linux-x86_64/files/etc/config
                cp .github/workflows/*.apk openwrt-imagebuilder-mediatek-filogic.Linux-x86_64/packages/
                cd openwrt-imagebuilder-mediatek-filogic.Linux-x86_64
                echo "REVISION=$(grep -n "REVISION:=" include/version.mk | tail -c 18)" >> $GITHUB_ENV
                echo "DAY=$(date +'%Y.%m.%d')" >> $GITHUB_ENV
                make image PROFILE=bananapi_bpi-r3 PACKAGES="adb adblock arp-scan arp-scan-database atop attendedsysupgrade-common bash blkdiscard blkid block-mount blockd blockdev bridger btop btrfs-progs bzip2 ca-certificates ccrypt certtool cfdisk cgi-io cgroup-tools collectd collectd-mod-conntrack collectd-mod-cpu collectd-mod-cpufreq collectd-mod-interface collectd-mod-irq collectd-mod-iwinfo collectd-mod-load collectd-mod-memory collectd-mod-network collectd-mod-rrdtool collectd-mod-sensors collectd-mod-thermal containerd coreutils coreutils-sort curl dnsmasq-full docker docker-compose dockerd dosfstools e2fsprogs eject ethtool exfat-fsck exfat-mkfs fdisk findfs fixparts flock gawk getopt glib2 glib2-core glib2-gio glib2-gmodule glib2-gobject glib2-gthread gnupg gnupg-utils gnutls-utils grep htop ip-full ip6tables-nft iperf3-ssl ipset iptables-mod-extra iptables-mod-ipopt iptables-nft iw kmod-asn1-decoder kmod-ata-ahci kmod-ata-core kmod-br-netfilter kmod-cfg80211 kmod-crypto-acompress kmod-crypto-arc4 kmod-crypto-blake2b kmod-crypto-cbc kmod-crypto-ccm kmod-crypto-chacha20poly1305 kmod-crypto-cmac kmod-crypto-crc32c kmod-crypto-ctr kmod-crypto-deflate kmod-crypto-ecb kmod-crypto-echainiv kmod-crypto-gcm kmod-crypto-geniv kmod-crypto-gf128 kmod-crypto-ghash kmod-crypto-kpp kmod-crypto-lib-chacha20 kmod-crypto-lib-chacha20poly1305 kmod-crypto-lib-curve25519 kmod-crypto-lib-poly1305 kmod-crypto-rng kmod-crypto-seqiv kmod-crypto-sha3 kmod-crypto-user kmod-crypto-xts kmod-crypto-xxhash kmod-cryptodev kmod-dax kmod-dm kmod-dummy kmod-fs-autofs4 kmod-fs-btrfs kmod-fs-exfat kmod-fs-ext4 kmod-fs-ksmbd kmod-fs-msdos kmod-fs-netfs kmod-fs-ntfs3 kmod-fs-smbfs-common kmod-fs-vfat kmod-fuse kmod-gre kmod-hwmon-core kmod-i2c-core kmod-ifb kmod-ikconfig kmod-inet-diag kmod-ip6tables kmod-ipsec kmod-ipt-checksum kmod-ipt-conntrack kmod-ipt-core kmod-ipt-extra kmod-ipt-ipopt kmod-ipt-ipset kmod-ipt-nat kmod-ipt-nat6 kmod-ipt-physdev kmod-iptables kmod-iptunnel kmod-keys-encryp